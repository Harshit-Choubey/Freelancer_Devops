version: '3.9'

name: gigmatrix

services:

  # ─── MongoDB Database ────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: gigmatrix-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: gigmatrix
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - gigmatrix-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Redis Cache ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: gigmatrix-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - gigmatrix-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Backend API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: gigmatrix-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mongodb://mongo:27017/gigmatrix
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: http://localhost:8080
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5242880}
      ALLOWED_FILE_TYPES: ${ALLOWED_FILE_TYPES:-image/jpeg,image/png,image/jpg,image/webp}
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gigmatrix-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/monitoring/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── NGINX Frontend + Reverse Proxy ─────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: gigmatrix-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gigmatrix-net

  # ─── Prometheus Monitoring ──────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: gigmatrix-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=1d'
      - '--storage.tsdb.retention.size=200MB'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    mem_limit: 256m
    networks:
      - gigmatrix-net

  # ─── cAdvisor ───────────────────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: gigmatrix-cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 128m
    networks:
      - gigmatrix-net

  # ─── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: gigmatrix-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    mem_limit: 256m
    networks:
      - gigmatrix-net

  # ─── Jenkins CI/CD ──────────────────────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts
    container_name: gigmatrix-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8082:8080"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Xmx512m
    mem_limit: 768m
    cpus: "1.5"
    networks:
      - gigmatrix-net
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  jenkins_data:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  gigmatrix-net:
    driver: bridge
