# ============================================================
# GigMatrix — SonarCloud Project Configuration
# Production-Grade | Phase 4 DevSecOps Integration
# ============================================================

# ── Required Metadata ───────────────────────────────────────
sonar.projectKey=Harshit-Choubey_Freelancer_Devops
sonar.organization=harshit-choubey
sonar.projectName=GigMatrix

# ── Source & Test Directories ───────────────────────────────
sonar.sources=src,server.js,setup.js
sonar.tests=src

# ── Encoding ────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Exclusions (non-application assets) ─────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.spec.js,\
  **/*.test.js,\
  docker/**,\
  docs/**,\
  nginx/**,\
  terraform/**,\
  k8s/**,\
  monitoring/**,\
  logs/**,\
  uploads/**,\
  prisma/**,\
  public/**,\
  **/tmp/**,\
  **/temp/**

# ── Test Exclusions ─────────────────────────────────────────
sonar.test.inclusions=**/*.spec.js,**/*.test.js

# ── Coverage Reports (populated when tests are integrated) ──
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ── Node.js / JavaScript Settings ───────────────────────────
# sonar.nodejs.executable=node   # Uncomment if scanner needs explicit path

# ── Jenkins Compatibility ────────────────────────────────────
# When transitioning to Jenkins, set these via environment injection:
# sonar.host.url=${SONAR_HOST_URL}      (SonarCloud: https://sonarcloud.io)
# sonar.login=${SONAR_TOKEN}            (Injected via withCredentials block)
# sonar.branch.name=${BRANCH_NAME}      (Injected by Jenkins multibranch)
# sonar.pullrequest.key=${PR_NUMBER}    (Injected for PR analysis)

# ── Quality Gate ─────────────────────────────────────────────
# Quality gate is enforced on SonarCloud dashboard.
# Future Jenkins pipelines will use: waitForQualityGate abortPipeline: true
